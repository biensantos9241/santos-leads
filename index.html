*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#1d2430}

.top{display:flex;align-items:center;gap:10px}
.top img{width:38px;height:38px;border-radius:9px;background:#fff}
.top h1{font-size:19px;margin:0;flex:1;line-height:1.1}
.top h1 small{display:block;font-size:12px;font-weight:400;opacity:.8}
#refresh{background:#fff;color:var(--navy);border:0;border-radius:10px;font-size:15px;font-weight:700;padding:10px 12px;min-height:44px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:22px;padding:9px 14px;font-size:15px;font-weight:700;min-height:44px}
.tab.on{background:#fff;color:var(--navy);border-color:#fff}
.tab .n{display:inline-block;min-width:22px;padding:1px 6px;margin-left:6px;border-radius:11px;background:rgba(255,255,255,.25);font-size:13px}
.tab.on .n{background:var(--navy);color:#fff}
#status{font-size:13px;padding:8px 14px;color:#555}

main{padding:6px 12px 40px}
.card{background:#fff;border-radius:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:8px solid #999;overflow:hidden}
.card .body{padding:12px 14px 6px}
.row1{display:flex;align-items:center;gap:8px}
.name{font-size:19px;font-weight:800;flex:1}
.badge{font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px;color:#fff}
.HOT{background:var(--red)}.WARM{background:#E69121}
.grp{font-size:13px;font-weight:700;margin-top:3px}
.meta{font-size:15px;margin-top:6px;line-height:1.5;color:#333}
.meta b{color:#000}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:#eef1f5;color:#333}
.st.New{background:#FFF2CC}.st.Scheduled{background:#D9EAF7}.st.Called-No.Answer,.st.CNA{background:#FCE5CD}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:56px;border-radius:12px;font-size:18px;font-weight:800;text-decoration:none;color:#fff}
.call{background:#1E8E3E}.text{background:#1565C0}
.upd{grid-column:1 / span 2;min-height:44px;font-size:15px;background:#eef1f5;color:var(--navy)}
.empty{text-align:center;color:#666;padding:40px 10px;font-size:16px}
.help{margin:20px 4px;font-size:13px;color:#555;line-height:1.45}

function parseCSV(text){
  var rows=[],row=[],f="",q=false;
  for (var i=0;i<text.length;i++){
    var c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (c!=='\r') f+=c;
  }
  if (f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function shortDate(s){ var m=String(s||"").match(/([A-Z][a-z]{2}) (\d{1,2}), (\d{4})/); return m? m[1]+" "+m[2]+", "+m[3] : s; }
function fill(tpl,l){ return (tpl||"").split("{Name}").join(l.name).split("{Branch}").join(l.branch).split("{Deadline}").join(shortDate(l.deadline)); }
function fromRow(r,idx){
  var g=function(name,fallback){ var i=idx[name]; return i===undefined? (fallback===undefined?"":r[fallback]) : r[i]; };
  var l={id:g("Lead ID",0),priority:g("Priority",1),name:g("Name",2),phone:(g("Phone",3)||"").replace(/[^\d+]/g,""),group:g("Interest Group",4),
         branch:g("Branch",5),deadline:g("Visit Deadline",6),status:g("Status",7),pref:g("Preferred Call Time",8),row:g("Leads Row",9),loc:g("Location/Area",10),nearest:g("Nearest Branch",11),docTime:g("Best Time for Doc's Call",12),kita:g("KITA Comment",13),msg:idx["SMS Message"]!==undefined? r[idx["SMS Message"]]:""};
  if (!l.msg) l.msg=fill(TEMPLATES[l.group],l);
  return l;
}
function load(){
  document.getElementById("status").textContent="Loading\u2026";
  fetch(CSV_URL+"&_="+Date.now(),{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  }).then(function(t){
    if (/^\s*</.test(t)) throw new Error("Sheet not shared");
    var rows=parseCSV(t); var head=rows.shift()||[]; var idx={};
    head.forEach(function(h,i){ idx[h.trim()]=i; });
    leads=rows.filter(function(r){return r.join("").trim()!=="";}).map(function(r){return fromRow(r,idx);}).filter(function(l){return l.name;});
    usingDemo=false; render();
  }).catch(function(e){
    leads=DEMO.map(function(r){return fromRow(r,{});}); usingDemo=true; render(String(e.message||e));
  });
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function inTab(l,key){ var g=GROUPS.filter(function(x){return x.key===key;})[0]; return g&&g.test? g.test(l) : l.group===key; }
function render(err){
  var b=document.getElementById("banner");
  if (usingDemo){ b.style.display="block"; b.innerHTML="<b>Demo mode:</b> showing sample TEST leads because the live Sheet can\u2019t be read yet ("+esc(err)+"). The Sheet owner must set Share \u2192 General access \u2192 <i>Anyone with the link: Viewer</i> for live data."; }
  else b.style.display="none";
  var tabs=document.getElementById("tabs");
  tabs.innerHTML=GROUPS.map(function(g){
    var n=leads.filter(function(l){return inTab(l,g.key);}).length;
    return '<button class="tab'+(g.key===current?' on':'')+'" data-k="'+esc(g.key)+'">'+esc(g.label)+'<span class="n">'+n+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(tabs.querySelectorAll(".tab"),function(el){ el.onclick=function(){ current=el.getAttribute("data-k"); render(err); window.scrollTo(0,0); }; });
  var list=leads.filter(function(l){return inTab(l,current);});
  document.getElementById("list").innerHTML = list.length? list.map(function(l){
    var col=GCOLOR[l.group]||"#999";
    var sms="sms:"+l.phone+"?&body="+encodeURIComponent(l.msg);
    var upd=EDIT_URL+"#gid="+LEADS_GID+(l.row? "&range=A"+l.row+":V"+l.row : "");
    return '<div class="card" style="border-left-color:'+col+'"><div class="body">'+
      '<div class="row1"><div class="name">'+esc(l.name)+'</div><span class="badge '+esc(l.priority)+'">'+esc(l.priority)+'</span></div>'+
      '<div class="grp" style="color:'+col+'">'+esc(l.group)+'</div>'+
      '<div class="meta">\uD83D\uDCCD <b>'+esc(l.branch)+'</b> &nbsp; \u23F3 until <b>'+esc(l.deadline)+'</b><br>'+
      '\uD83C\uDFE0 Location: <b>'+esc(l.loc||'\u2014 itanong po')+'</b>'+(l.nearest&&l.nearest!==l.branch? ' (nearest: '+esc(l.nearest)+')':'')+'<br>'+
      '\uD83D\uDC68\u200D\u2695\uFE0F Doc\u2019s call: <b>'+esc(l.docTime||'\u2014 itanong po')+'</b><br>'+
      '<span class="st">'+esc(l.status)+'</span>'+(/^y/i.test(l.kita||'')? ' <span class="st" style="background:#FDE2E1;color:#B00">KITA</span>':'')+(l.pref? ' &nbsp; \uD83D\uDD52 '+esc(l.pref):'')+' &nbsp; <span style="color:#777">'+esc(l.phone)+'</span></div></div>'+
      '<div class="btns"><a class="btn call" href="tel:'+esc(l.phone)+'">\uD83D\uDCDE Call</a>'+
      '<a class="btn text" href="'+esc(sms)+'">\uD83D\uDCAC Text</a>'+
      '<a class="btn upd" href="'+esc(upd)+'" target="_blank" rel="noopener">\u270F\uFE0F Update status in Sheet</a></div></div>';
  }).join("") : '<div class="empty">No leads to call in this group \uD83C\uDF89</div>';
  var now=new Date().toLocaleTimeString("en-PH",{timeZone:"Asia/Manila",hour:"numeric",minute:"2-digit"});
  document.getElementById("status").textContent=(usingDemo?"Demo data":"Live from Sheet")+" \u00B7 "+leads.length+" to call \u00B7 updated "+now+" (Manila) \u00B7 auto-refresh every 1 min";
}
document.getElementById("refresh").onclick=load;
document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(); });
setInterval(function(){ if(!document.hidden) load(); }, AUTO_REFRESH_MS);
load();
</script>
</body>
</html>
